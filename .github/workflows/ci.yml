name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: check out repository code
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t event-api:latest .

      - name: Start container
        run: docker run -d -p 5000:5000 --name event-api-container event-api:latest

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:5000/api/health

      - name: Set Up Python in Runner
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Stop container
        if: always()
        run: docker stop event-api-container

      - name: Remove container
        if: always()
        run: docker rm event-api-container

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for Render deployment
        run: sleep 30
          
